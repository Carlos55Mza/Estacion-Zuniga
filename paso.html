<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado del Paso - Estación Zúñiga</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            background: #0d131a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Caja contenedora nítida y profesional */
        .caja-paso {
            background: #1a222b; /* Fondo sólido para evitar el desenfoque no deseado */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; /* Bordes redondeados sutiles */
            padding: 25px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* Sombra nítida */
            box-sizing: border-box;
        }

        /* Estilo para el botón de acción principal */
        .btn-accion-verde {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #2ecc71; /* Color verde vibrante */
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 12px; /* Bordes redondeados nítidos */
            font-weight: bold;
            font-size: 1.1rem;
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .btn-accion-verde:hover {
            background: #27ae60;
            transform: translateY(-1px);
        }

        /* Estilo para el enlace de "Volver" */
        .enlace-volver {
            color: #8a99a6;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .enlace-volver:hover {
            color: white;
        }
    </style>
</head>
<body>

    <div class="caja-paso">
        <h2 style="margin-top:0; font-size: 1.4rem; color: #ced4da; margin-bottom: 25px;">
            <span style="vertical-align: middle;">🏔️</span> REPORTE ALTA MONTAÑA
        </h2>
        
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin-bottom: 25px;">

        <div style="margin: 35px 0;">
            <span class="material-symbols-outlined" style="font-size: 55px; color: #74b9ff;">info</span>
            <p style="color: #ced4da; line-height: 1.6; margin-top: 15px;">
                Para consultar el estado oficial en tiempo real del <b>Sistema Cristo Redentor</b>, hacé clic en el botón de abajo.
            </p>
        </div>

        <a href="https://www.argentina.gob.ar/seguridad/pasosinternacionales/detalle/ruta/29/Sistema-Cristo-Redentor" target="_blank" class="btn-accion-verde">
            <span class="material-symbols-outlined">open_in_new</span> Ver Estado Oficial (PasAr)
        </a>

        <a href="index.html" class="enlace-volver">Volver a la Estación</a>
    </div>

</body>
</html>
