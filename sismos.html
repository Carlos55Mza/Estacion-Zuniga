<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sismógrafo - Estación Zúñiga</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            background: #091016;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .caja-sismos {
            max-width: 500px;
            width: 100%;
            border: 2px solid rgba(231, 76, 60, 0.3);
            border-radius: 24px;
            padding: 25px;
            background: #1a222b;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        /* Contenedor del reporte oficial */
        .contenedor-inpres {
            width: 100%;
            height: 350px;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
            background: white; /* El fondo del iframe es blanco */
        }
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="caja-sismos">
        <h2 style="margin-top:0; font-size: 1.3rem; color: #e74c3c; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span class="material-symbols-outlined">sensors</span> RADAR SÍSMICO EN VIVO
        </h2>
        <div style="font-size: 0.75rem; color: #a0a0a0;">MONITOREO OFICIAL (INPRES)</div>
        
        <a href="https://www.inpres.gob.ar/desktop/" target="_blank" 
           class="btn-volver" style="background: #e74c3c; color: white; width: 100%; justify-content: center; padding: 15px; margin-top: 20px;">
            <span class="material-symbols-outlined">open_in_new</span> Ver Reporte Oficial (INPRES)
        </a>

        <a href="index.html" class="btn-volver">
            <span class="material-symbols-outlined">arrow_back</span> Volver a la Estación
        </a>
    </div>

</body>
</html>
